org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Release configuration (override with -P..., environment variables or GitHub secrets) ----
# AdMob IDs. Defaults are Google's public TEST ids, so nothing real is shown until you replace them.
# ADMOB_APP_ID=ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy
# ADMOB_BANNER_ID=ca-app-pub-xxxxxxxxxxxxxxxx/zzzzzzzzzz
# ADMOB_APP_OPEN_ID=ca-app-pub-xxxxxxxxxxxxxxxx/wwwwwwwwww
# Public URL of docs/privacy-policy.html (GitHub Pages). The CI workflow fills this automatically.
# PRIVACY_URL=https://YOUR_GITHUB_USERNAME.github.io/SmartTrace/privacy-policy.html
