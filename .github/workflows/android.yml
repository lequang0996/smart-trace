name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Public URL of docs/privacy-policy.html once GitHub Pages is enabled (see pages.yml).
      PRIVACY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/privacy-policy.html
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Lint and build debug APK
        run: gradle :app:lintDebug :app:assembleDebug --stacktrace -PPRIVACY_URL="$PRIVACY_URL" -PABI_FILTERS=arm64-v8a,armeabi-v7a

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SmartTrace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # ---- Signed release build (only when the signing secrets exist) ----
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_APP_OPEN_ID: ${{ secrets.ADMOB_APP_OPEN_ID }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace -PPRIVACY_URL="$PRIVACY_URL"

      - name: Upload release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: SmartTrace-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB (for Google Play)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: SmartTrace-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
